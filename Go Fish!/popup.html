<!DOCTYPE html>
<html>
<head>
<title>Go Fish!</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<style>
</style>
<body style="user-select: none;">
<div id="debugcatching" style="font-family: monospace; position: fixed; left: 0px; top: 0px;">PRE-ALPHA v0.0.1<br><div id="fishingdebug"><div onclick="reset();" style="color: #008800; cursor: pointer">Click here to start Go Fishing</div></div></div>
<div id="directionthing" style="display: none; position: absolute; top: 100px;">
<div id="directionplaceholder">Placeholder</div>
<button onclick="dirpressfeedback(1)">up</button>
<button onclick="dirpressfeedback(2)">down</button>
<button onclick="dirpressfeedback(3)">left</button>
<button onclick="dirpressfeedback(4)">right</button><br>
<button onclick="dirpressfeedback(94855)">Failure</button><br><c style="opacity: 0.5; font-size: 75%">you can use arrow keys/WASD to control!</c>
</div>
</body>
<script>
var equippedrod=0
var currentrods = [[25,50,1],[10000,50000,5]] //rod type, [maxtiminghp, maxlurehp,catchingefficiency]
var caughtfish = [false,-1]
var linebroke = false
var fishingcaught = [false,0,500,25,25] //iscatching, whattype, distancefromcatching, timinghp, lurehp
var directions = [0,0] //direction (up,down,left,right: 0-3), cooldown, cooldownmax
var catchinterval = setInterval(function(){
if (fishingcaught[0] && !linebroke){
if (fishingcaught[1]==0){
fishingcaught[3]-=0.2
}
var relativetoperfection = Math.abs((fishingcaught[3]-(currentrods[equippedrod][1]/2)))
if (fishingcaught[1]==0){
fishingcaught[2]+=Math.max(0,(-0.2*((((fishingcaught[3]+10)-(currentrods[equippedrod][1]/2))))))
}
var catchingpenalty = ((2*(relativetoperfection/(currentrods[equippedrod][1]/2)))-100)
var caughtgain = Math.abs((currentrods[equippedrod][2]*(Math.abs((fishingcaught[3]-(currentrods[equippedrod][1]/2)))-(currentrods[equippedrod][1]/2))))+10
document.getElementById("fishingdebug").innerHTML="You're Go Fishing!<br>Distance: "+Math.trunc(fishingcaught[2])+" ("+Math.trunc(caughtgain)+")<br>TimingHP: "+Math.max(0,(Math.trunc(fishingcaught[3]*10)/10))+"/"+currentrods[equippedrod][1]+" (aim for "+(currentrods[equippedrod][1]/2)+"/"+currentrods[equippedrod][1]+"!)<br>LureHP: "+fishingcaught[4]+"/"+currentrods[equippedrod][0]+" (mistimings will decrease this!)"
if (relativetoperfection>(currentrods[equippedrod][1]/2) || fishingcaught[4]<=0){
fishingcaught[0]=false
linebroke=true
document.getElementById('directionthing').style.display='none'
if (fishingcaught[4]<=0 || fishingcaught[3]>currentrods[equippedrod][1]){
document.getElementById("fishingdebug").innerHTML="<c style='color: #FF0000'>You've broke the line! <div onclick='reset()' style='cursor: pointer'>Click here to retry.</div></c>Distance: "+Math.trunc(fishingcaught[2])+"<br>TimingHP: "+Math.max(0,(Math.trunc(fishingcaught[3]*10)/10))+"/"+currentrods[equippedrod][1]+" (aim for "+(currentrods[equippedrod][1]/2)+"/"+currentrods[equippedrod][1]+"!)<br>LureHP: "+Math.max(0,fishingcaught[4])+"/"+currentrods[equippedrod][0]+" (mistimings will decrease this!)"
} else {
document.getElementById("fishingdebug").innerHTML="<c style='color: #FF0000'>It got away! <div onclick='reset()' style='cursor: pointer'>Click here to retry.</div></c>Distance: "+Math.trunc(fishingcaught[2])+"<br>TimingHP: "+Math.max(0,(Math.trunc(fishingcaught[3]*10)/10))+"/"+currentrods[equippedrod][1]+" (aim for "+(currentrods[equippedrod][1]/2)+"/"+currentrods[equippedrod][1]+"!)<br>LureHP: "+Math.max(0,fishingcaught[4])+"/"+currentrods[equippedrod][0]+" (mistimings will decrease this!)"
}
}

if (fishingcaught[2]<=0){
fishingcaught[0]=false
document.getElementById('directionthing').style.display='none'
document.getElementById("fishingdebug").innerHTML="<div style='color: #008800;'>CAUGHT!!</div><div onclick='reset()' style='color: #008800; cursor: pointer'>Click here to retry.</div>"
}
}
if (fishingcaught[0]==true){
/**
directions[1]-=1
if (directions[1]<=0){
directions[0]=Math.trunc((Math.random()*4)+1)
directions[1]=50
}**/
if (directions[0]==1){
document.getElementById("directionplaceholder").innerHTML="Press UP"
} else if (directions[0]==2){
document.getElementById("directionplaceholder").innerHTML="Press DOWN"
} else if (directions[0]==3){
document.getElementById("directionplaceholder").innerHTML="Press LEFT"
} else if (directions[0]==4){
document.getElementById("directionplaceholder").innerHTML="Press RIGHT"
} else {
document.getElementById("directionplaceholder").innerHTML="throw up on your keyboard"
}
}
}, 50)
function dirpressfeedback(which){
if (which==directions[0]){
directions[0]=Math.trunc((Math.random()*4)+1)
fishingcaught[3]+=5
directions[1]=50
fishingcaught[2]-=Math.abs((currentrods[equippedrod][2]*(Math.abs((fishingcaught[3]-(currentrods[equippedrod][1]/2)))-(currentrods[equippedrod][1]/2))))+10
} else {
directions[0]=Math.trunc((Math.random()*4)+1)
fishingcaught[4]-=10
directions[1]=50
}
}
function startcatching(fishdistance,fishtype){
if (equippedrod==0){
directions[0] = Math.trunc((Math.random()*4)+1)
document.getElementById("directionplaceholder").innerHTML="Placeholder"
document.getElementById('directionthing').style.display=''
fishingcaught = [true,fishtype,fishdistance,(currentrods[equippedrod][1]/2),currentrods[equippedrod][0]]
}
}
function reset(){
equippedrod=0
caughtfish = [false,-1]
linebroke = false
fishingcaught = [false,0,500,25,25] //iscatching, whattype, distancefromcatching, timinghp, lurehp
directions = [2,0] //direction (up,down,left,right: 1-4), cooldown, cooldownmax
startcatching(500,0);
}
document.onkeydown = function (e) { 
console.log(e.keyCode)
if (e.keyCode==87 || e.keyCode==38){
dirpressfeedback(1)
} else if (e.keyCode==83 || e.keyCode==40){
dirpressfeedback(2)
} else if (e.keyCode==65 || e.keyCode==37){
dirpressfeedback(3)
} else if (e.keyCode==68 || e.keyCode==39){
dirpressfeedback(4)
}
}
</script>
</html>
