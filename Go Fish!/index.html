<!DOCTYPE html>
<head>
<title>Go Fish!</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body style="background-color: #6481F9;">
<div style="user-select: none; position: fixed;left: 0%;top: 20%;text-align: center;width: 100%;color: #FF8800;filter: drop-shadow(4px 4px #221100);font-size: 400%;">Go Fish!</div>
<div style="user-select: none; position: fixed;left: calc(50% - 78px);top: 60%;text-align: center;width: ;color: #FF8800;filter: drop-shadow(2px 2px #000000);font-size: 150%; cursor: pointer;" onclick="popup(0);"><div style="user-select: none; position: fixed;left: -25%;top: 125%;text-align: center;width: 150%;color: #FF8800;filter: drop-shadow(0px 0px #210);font-size: 75%; cursor: pointer;opacity: 1;cursor: auto;pointer-events:none;">This will open a popup</div><c style="position: relative; top: 0%; left: 0%; width: 250px; height: 125px; background-color: #87533c; padding: 10px 15px; border-radius: 25px;">Start Game</c></div>
<div id="multiinstancewarn" style="user-select: none; position: fixed; color: #FF8800; filter: drop-shadow(rgb(34, 17, 0) 4px 4px); font-size: 400%; width: 500px; height: 500px; top: calc(50% - 250px); left: calc(50% - 250px); display: none;"><div style="position: absolute; width: 470px; height: 490px; top: calc(50% - 250px); left: calc(50% - 250px); background-color: #683f2c; border-radius: 25px;padding: 5px 15px;">Notice!</div><div style="position: absolute; font-size: 60%;top: 90px;left: 15px;width: calc(100% - 60px);">The game is already running!</div><div style="position: absolute; bottom: 20px; left: calc(50% - 75px); width: 150px; height: 55px; background-color: #ab6342;  border-radius: 25px;font-size: 60%;text-align: center;cursor: pointer;" onclick="this.parentElement.style.display='none';">Okay</div></div>
</body>
<script>
//#481f0c unavailable color
var poopup = null
function popup(which){
if (poopup==null || poopup.closed!=false){
var params = `scrollbars=no,resizable=no,status=no,location=no,toolbar=no,menubar=no,
width=1024,height=992,left=`+((window.screen["availWidth"]/2)-512)+`,top=`+((window.screen["availHeight"]/2)-496)+``;
poopup = open('popup.html', 'test', params);
} else {
document.getElementById("multiinstancewarn").style.display=""
}
}
</script>
